["R","¿Qué hace <code>MYSQL_DATABASE=colegio_db</code>?","Crea esa base de datos al iniciar el contenedor","Cambia la contraseña","Define el puerto","Crea un volumen","La imagen oficial de MySQL crea la base al arrancar."],
["R","¿Qué permite una app Node para conectar a MySQL en una bridge personalizada?","Usar el nombre del contenedor como host","Usar siempre localhost","Usar una IP fija","Usar el puerto del host","El DNS interno resuelve nombres como <code>mysql-servidor</code>."],
["R","¿Para qué sirve aislar la base de datos de la red pública?","Para que solo los servicios internos puedan acceder","Para acelerarla","Para evitar los volúmenes","Para no usar contraseña","Sin exponer puertos al exterior, queda protegida en la red interna."],
["R","¿Por qué la red bridge personalizada es más segura que la por defecto?","Aísla los contenedores en una red privada y tú decides qué se conecta","Cifra el tráfico","Desactiva Docker","Elimina contraseñas","Solo se comunican los contenedores añadidos a esa red."]
];
const $=id=>document.getElementById(id),app=$("app");
let sel="all",pool,n,score,pick,done,fails;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function menu(){
 const c=k=>k=="all"?Q.length:Q.filter(q=>q[0]==k).length;
 app.innerHTML=`<b>Elige tema</b><div class="chips">${["all",...Object.keys(T)].map(k=>`<button class="chip ${k==sel?"on":""}" onclick="sel='${k}';menu()">${k=="all"?"Todos":T[k]} (${c(k)})</button>`).join("")}</div>
 <p class="sub">Responde, pulsa <b>Confirmar</b> y verás si acertaste y por qué.</p><button class="main" onclick="start()">Empezar</button>`}
function start(list){pool=shuf(list||Q.filter(q=>sel=="all"||q[0]==sel));n=0;score=0;fails=[];show()}
function show(){
 const q=pool[n];pick=null;done=false;
 q.o=shuf([2,3,4,5].map(i=>({t:q[i],ok:i==2})));
 app.innerHTML=`<div class="meta"><span>${T[q[0]]}</span><span>${n+1} / ${pool.length}</span></div><div class="bar"><i style="width:${n/pool.length*100}%"></i></div>
 <div class="q">${q[1]}</div>${q.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="ch(${i})">${o.t}</button>`).join("")}
 <div id="fb"></div><div class="row"><button class="main" id="go" disabled onclick="go()">Confirmar</button></div>`}
function ch(i){if(done)return;pick=i;q4().o.forEach((_,j)=>$("o"+j).classList.toggle("sel",j==i));$("go").disabled=false}
const q4=()=>pool[n];
function go(){
 const q=q4();
 if(!done){
  done=true;const ok=q.o[pick].ok;
  q.o.forEach((o,j)=>{const b=$("o"+j);b.disabled=true;b.classList.remove("sel");if(o.ok)b.classList.add("ok");else if(j==pick)b.classList.add("ko")});
  if(ok)score++;else fails.push(q);
  const right=q.o.find(o=>o.ok).t;
  $("fb").innerHTML=ok?`<div class="fb ok"><b>✅ ¡Correcto!</b>${q[6]}</div>`:`<div class="fb ko"><b>❌ Incorrecto</b>La respuesta correcta es: <b style="display:inline">${right}</b><br><br><b>¿Por qué?</b>${q[6]}</div>`;
  $("go").textContent=n+1<pool.length?"Siguiente →":"Ver resultado";
 }else{n++;n<pool.length?show():end()}
}
function end(){
 const p=Math.round(score/pool.length*100);
 app.innerHTML=`<div class="score">${score} / ${pool.length}</div><p>${p}% de aciertos ${p>=90?"🏆":p>=50?"👍":"📚"}</p>
 <div class="row"><button class="main" onclick="menu()">Elegir otro tema</button>${fails.length?`<button class="main" onclick="start(fails)">Repetir fallos (${fails.length})</button>`:""}</div>`}
menu();
</script></body></html>
