const op=operation==='mix'?shuffle(['+','−','×','÷'])[0]:operation;

if(op==='÷'){b=rand(1,difficulty==='facil'?10:25);answer=mode==='decimales'?rand(-limit*10,limit*10)/10:rand(-limit,limit);a=Number((answer*b).toFixed(2));}else answer=op==='+'?a+b:op==='−'?a-b:a*b;

</script><script>
const E=Engine,$=s=>document.querySelector(s),main=$('#main');
let state={attempts:0,correct:0,days:[],riddles:{},customRiddles:{},wordEntries:{},wordDrafts:{},sessions:0};try{const saved=JSON.parse(localStorage.getItem('inteligencevirus-v1'));if(saved&&Array.isArray(saved.days)&&typeof saved.riddles==='object')state={...state,...saved}}catch{}
let storageOk=true,page='inicio',session=null;
function save(){try{localStorage.setItem('inteligencevirus-v1',JSON.stringify(state))}catch{storageOk=false}}
function record(correct){state.attempts++;if(correct)state.correct++;const key=E.dateKey();if(!state.days.includes(key))state.days.push(key);save()}
function streak(){let n=0,d=new Date();if(!state.days.includes(E.dateKey(d)))d.setDate(d.getDate()-1);while(state.days.includes(E.dateKey(d))){n++;d.setDate(d.getDate()-1)}return n}
const subjects={palabra:{title:"Palabra diaria",icon:"Ñ",tag:"ESPAÑOL",desc:"Descubre una palabra y úsala en una frase propia.",color:"#f8e8ee",accent:"#ad6f85"},ingles:{title:'Inglés',icon:'Aa',tag:'A1 → C2',desc:'Abre nuevas puertas. Vocabulario y gramática, a tu nivel.',color:'#ebeffa',accent:'#6677ad'},enteros:{title:'Números enteros',icon:'±',tag:'CÁLCULO MENTAL',desc:'Suma, resta, multiplica y divide. Dale agilidad a tu mente.',color:'#eaf1e7',accent:'#668c55'},decimales:{title:'Números decimales',icon:'0.5',tag:'PRECISIÓN',desc:'Cada decimal cuenta. Practica y gana confianza.',color:'#f9eee2',accent:'#bd9159'},horas:{title:'Cálculo de horas',icon:'◷',tag:'DÍA A DÍA',desc:'Horas, minutos y duraciones. Haz que el tiempo cuadre.',color:'#eeeafa',accent:'#9a80ba'},dinero:{title:'Cálculo de dinero',icon:'€',tag:'VIDA REAL',desc:'Compras y cambios. Domina tus cuentas en euros.',color:'#e7f2ef',accent:'#669b8f'},adivinanza:{title:'Adivinanza diaria',icon:'✧',tag:'UN RETO AL DÍA',desc:'Piensa diferente. Una nueva oportunidad de sorprenderte.',color:'#eae6cb',accent:'#9b9252'}};
function home(){session=null;main.innerHTML=`<div class="welcome"><div><div class="eyebrow">EXPLORA TU POTENCIAL</div><h1>Tu mente también se entrena.</h1><p class="intro">Unos minutos, un nuevo reto y un paso más. ¿Empezamos?</p></div><span class="date-pill">✦ A tu ritmo, sin presión</span></div><section class="hero"><div><div class="eyebrow">LENGUAJE · LÓGICA · CURIOSIDAD</div><h2>Conecta ideas.<br>Expande tu conocimiento.</h2><p>Del primer «hello» a las cuentas del día a día.<br>Tu próximo logro empieza aquí.</p><button class="primary" data-go="ingles">Empezar a practicar <span aria-hidden="true">↗</span></button></div><div class="hero-art" aria-hidden="true">${neuralArt()}</div></section><div class="stats"><div class="stat"><span class="stat-icon">⚡</span><div><strong>${streak()} <small>días</small></strong><small>Racha de aprendizaje</small></div></div><div class="stat"><span class="stat-icon">✓</span><div><strong>${state.attempts}</strong><small>Ejercicios completados</small></div></div><div class="stat"><span class="stat-icon">◎</span><div><strong>${state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—'}</strong><small>Respuestas correctas</small></div></div></div><section><div class="section-head"><h2>¿Qué quieres entrenar hoy?</h2><span>Elige tu reto. Tú marcas el ritmo.</span></div><div class="cards">${Object.entries(subjects).map(([id,s])=>`<article class="card ${id==='adivinanza'?'riddle':''}"><div class="card-top"><span class="icon" style="--tint:${s.color};--accent:${s.accent}">${s.icon}</span><span class="tag">${s.tag}</span></div><h3>${s.title}</h3><p>${s.desc}</p><button data-go="${id}">${id==='adivinanza'?'Descubrir el reto':'Practicar ahora'} <span aria-hidden="true">↗</span></button></article>`).join('')}</div></section><div class="bottom-note">✧ Cada reto es una nueva conexión.</div><p class="notice" style="text-align:center">${storageOk?'Tu progreso se guarda en este navegador.':'El navegador no permite guardar el progreso; se conservará solo durante esta visita.'}</p>`;wireGo()}
function wireGo(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go))}
function navigate(next){page=next;session=null;document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(page==='inicio')home();else if(page==='adivinanza')riddle();else if(page==='palabra')wordPage();else practice();window.scrollTo({top:0,behavior:'smooth'})}
function practice(){const s=subjects[page];main.innerHTML=`<button class="back" data-go="inicio">← Mi entrenamiento</button><div class="eyebrow">ENTRENA A TU RITMO</div><h1>${s.title}</h1><p class="intro">${s.desc} Sesiones de 10 preguntas, sin límite de tiempo.</p><div class="settings">${page==='ingles'?`<div><label for="level">Nivel de inglés</label><select id="level">${['A1 · Principiante','A2 · Básico','B1 · Intermedio','B2 · Intermedio alto','C1 · Avanzado','C2 · Dominio'].map(x=>`<option value="${x.slice(0,2)}">${x}</option>`).join('')}</select></div>`:`<div><label for="difficulty">Dificultad</label><select id="difficulty"><option value="facil">Fácil</option><option value="medio">Media</option><option value="dificil">Difícil</option></select></div>${['enteros','decimales'].includes(page)?'<div><label for="operation">Operaciones</label><select id="operation"><option value="mix">Todas las operaciones</option><option>+</option><option>−</option><option>×</option><option>÷</option></select></div>':''}`}</div><div id="exercise"></div><p class="notice">${page==='ingles'?'Práctica de gramática y vocabulario orientada a los niveles A1–C2. No sustituye un examen de certificación.':page==='decimales'?'Puedes usar coma o punto decimal. Redondea a 2 decimales cuando sea necesario.':page==='horas'?'Escribe la hora en formato de 24 horas: HH:MM.':'Puedes escribir números negativos con el signo − del teclado (guion). Para dinero, usa coma o punto decimal.'}</p>`;wireGo();document.querySelectorAll('select').forEach(s=>s.onchange=start);start()}
function start(){session={i:0,score:0,answered:false,selected:null,questions:[]};if(page==='ingles'){session.questions=E.shuffle(E.bank[$('#level').value]).map(row=>({prompt:row[0],answer:row[1],options:E.shuffle(row.slice(1,4)),explanation:row[4],type:'choice'}))}else{for(let i=0;i<10;i++)session.questions.push(E.generate(page,$('#difficulty').value,$('#operation')?.value||'mix'))}showQuestion()}
function showQuestion(){const q=session.questions[session.i];session.answered=false;session.selected=null;$('#exercise').innerHTML=`<section class="exercise"><div class="exercise-top"><span>Pregunta ${session.i+1} de 10</span><span>${session.score} aciertos</span></div><div class="progress" role="progressbar" aria-label="Progreso de la sesión" aria-valuenow="${session.i}" aria-valuemin="0" aria-valuemax="10"><div style="width:${session.i*10}%"></div></div><div class="eyebrow">${page==='ingles'?'ELIGE LA RESPUESTA CORRECTA':'RESUELVE EL RETO'}</div><h2 class="question">${q.prompt}</h2><form id="answer-form">${q.type==='choice'?`<div class="options">${q.options.map((o,i)=>`<button class="option" type="button" data-choice="${i}">${o}</button>`).join('')}</div>`:`<label for="answer">${q.type==='time'?'Tu respuesta (HH:MM)':'Tu respuesta'+(page==='dinero'?' en euros':'')}</label><input id="answer" autocomplete="off" placeholder="${q.type==='time'?'Ej. 14:30':'Escribe el resultado'}" inputmode="${q.type==='time'?'text':'decimal'}" required>`}<div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="primary" id="check" type="submit">Comprobar respuesta</button><button class="secondary" type="button" id="skip">No lo sé</button></div></form></section>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{session.selected=q.options[Number(b.dataset.choice)];document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('chosen',x===b);x.setAttribute('aria-pressed',String(x===b))})});$('#answer-form').onsubmit=e=>{e.preventDefault();if(session.answered){next();return}const value=q.type==='choice'?session.selected:$('#answer').value;if(!value){$('#feedback').textContent='Escribe o selecciona una respuesta para continuar.';return}finish(E.isCorrect(q,value))};$('#skip').onclick=()=>finish(false)}
function finish(correct){if(session.answered)return;session.answered=true;if(correct)session.score++;record(correct);const q=session.questions[session.i];$('#feedback').className='feedback'+(correct?'':' wrong');$('#feedback').textContent=(correct?'¡Muy bien! ':'La respuesta correcta es '+String(q.answer).replace('.',',')+'. ')+q.explanation;document.querySelectorAll('.option,#answer').forEach(b=>b.disabled=true);$('#skip').hidden=true;$('#check').textContent=session.i===9?'Ver resultado':'Siguiente pregunta →';$('#check').focus()}
function next(){session.i++;if(session.i<10){showQuestion();$('#answer')?.focus();return}state.sessions++;save();$('#exercise').innerHTML=`<section class="exercise result"><div class="eyebrow">SESIÓN COMPLETADA</div><div class="score">${session.score}<span style="font-size:25px;color:#9ba595"> / 10</span></div><h2>${session.score>=8?'¡Gran entrenamiento!':'Cada intento cuenta.'}</h2><p class="muted">${session.score>=8?'Tu constancia está dando frutos.':'Sigue practicando: los errores también enseñan.'}</p><div class="actions" style="justify-content:center"><button class="primary" id="again">Otra sesión</button><button class="secondary" data-go="inicio">Volver al inicio</button></div></section>`;$('#again').onclick=start;wireGo()}
function riddle(){const key=E.dateKey(),q=state.customRiddles[key]?.q||E.daily(),done=state.riddles[key];main.innerHTML=`<button class="back" data-go="inicio">← Mi entrenamiento</button><div class="eyebrow">UN MOMENTO PARA PENSAR DIFERENTE</div><h1>Tu adivinanza del día</h1><p class="intro">Un pequeño desafío para una mente curiosa. Cambia a medianoche, según tu hora local.</p><section class="exercise"><div class="exercise-top"><span>${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long'})}</span><span class="badge">${escapeHTML(q[3]||"Reto personalizado")}</span></div><div class="riddle-mark">✧</div><h2 class="question">${escapeHTML(q[0])}</h2><form id="riddle-form"><label for="riddle-answer">¿Qué crees que es?</label><input id="riddle-answer" placeholder="Escribe tu respuesta" autocomplete="off" required ${done?'disabled':''}><div id="riddle-feedback" class="feedback" role="status">${done?`Reto completado. La respuesta es: ${escapeHTML(q[1][0])}. ¡Mañana tienes otro!`:''}</div><div class="actions"><button class="primary" id="riddle-check" ${done?'disabled':''}>Comprobar</button><button type="button" class="secondary" id="hint">Ver pista</button><button type="button" class="secondary" id="reveal" ${done?'disabled':''}>Ver solución</button></div><p id="hint-text" class="muted" aria-live="polite"></p></form></section><p class="notice">Colección rotativa de ${E.riddles.length} adivinanzas. Puedes intentarlo varias veces; el reto se registra una sola vez al acertar o ver la solución.</p>`;wireGo();riddleSources(key);const complete=correct=>{state.riddles[key]=correct?'solved':'revealed';record(correct);riddle()};$('#hint').onclick=()=>{$('#hint-text').textContent=q[2]};$('#reveal').onclick=()=>complete(false);$('#riddle-form').onsubmit=e=>{e.preventDefault();if(E.dateKey()!==key){riddle();return}if(state.riddles[key])return;if(q[1].some(a=>E.normalize(a)===E.normalize($('#riddle-answer').value)))complete(true);else{$('#riddle-feedback').className='feedback wrong';$('#riddle-feedback').textContent='Todavía no. Prueba otra vez o pide una pista.'}}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('.brand').onclick=e=>{e.preventDefault();navigate('inicio')};$('#date').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});let lastDay=E.dateKey();setInterval(()=>{if(lastDay!==E.dateKey()){lastDay=E.dateKey();if(page==='adivinanza')riddle();else if(page==='palabra')wordPage();else if(page==='inicio')home()}},30000);home();

</script></body></html>
